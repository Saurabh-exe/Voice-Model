[project]
name = "voice-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dotenv>=0.9.9",
    "coqui-tts==0.25.3",
    "faster-whisper>=1.2.1",
    "ipykernel>=6.31.0",
    "langchain>=0.3.30",
    "langchain-nvidia-ai-endpoints>=0.3.19",
    "ollama>=0.6.3",
    "openai>=2.48.0",
    "pandas>=2.3.3",
    "pip>=26.0.1",
    "speechbrain>=1.1.2",
    "transformers>=4.43.0,<=4.46.2",
    "kaggle>=1.7.4.5",
]

[project.scripts]
voice-model = "voice_model:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
